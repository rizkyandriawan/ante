[package]
name = "ante-amqp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AMQP 0-9-1 compatibility adapter for Ante"

[dependencies]
ante-core = { path = "../ante-core" }
ante-security = { path = "../ante-security" }
tokio.workspace = true

[dev-dependencies]
lapin = "3"
futures-util = "0.3"
rcgen = "0.13"
tempfile = "3"
serde_json = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
