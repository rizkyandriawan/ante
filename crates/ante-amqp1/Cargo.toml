[package]
name = "ante-amqp1"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AMQP 1.0 adapter for Ante"

[dependencies]
ante-core = { path = "../ante-core" }
ante-security = { path = "../ante-security" }
fe2o3-amqp = { version = "0.18.4", path = "vendor/fe2o3-amqp", features = ["acceptor", "rustls"] }
tokio.workspace = true
socket2 = "0.6"

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = "0.26"
serde_json = "1"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
